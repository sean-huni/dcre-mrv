# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  batch:
    # SCRUM-107: MRV now ships two jobs (arrival validation / account reference artifact
    # load); Boot's JobLauncherApplicationRunner refuses to start with more than one Job
    # bean unless a name selects one, so the selector is committed here with the
    # validation flow as the default. A reference load is launched by overriding
    # DCRE_MRV_JOB_NAME with mrvAccountReferenceLoadJob. Same mechanism MRG uses for its
    # report/sweep pair (DCRE_MRG_JOB_NAME).
    job:
      name: ${DCRE_MRV_JOB_NAME:mrvJob}
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as MRV_BATCH_)
    database-change-log-table: mrv_databasechangelog
    database-change-log-lock-table: mrv_databasechangeloglock

dcre:
  batch:
    table-prefix: MRV_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  mrv:
    reference:
      account:
        # Same relative-hop form as dcre.exchange-root above: six hops from this module
        # directory to the repo root, then infra/dcre-infra. Deployed contexts override
        # with an absolute path (12FactorApp Alignment - https://12factor.net/).
        root: ${DCRE_MRV_ACCOUNT_REFERENCE_ROOT:../../../../../../infra/dcre-infra/fixtures/reference/account}
        # The version THIS service demands. The loader never picks the newest directory:
        # that would be a fail-open, and a consumer that cannot say which dataset it ran
        # against has no record worth keeping.
        dataset-version: ${DCRE_MRV_ACCOUNT_DATASET_VERSION:2026.08.09-001}
        # max-age: DELIBERATELY UNSET. See A-4. The freshness gate is wired and INERT, and
        # says so at INFO on every run; setting a Duration here arms it. No number is
        # invented in code, in this file, or in a test resource.
    # R-41 acceptance semantics mirror CTV: whole-file rejection on any business FAIL
    # unless a client is explicitly mapped to PARTIAL. Binding is directly to the enum,
    # so an unknown mode value fails startup (fail closed).
    acceptance-mode:
      default: ALL_OR_NOTHING
      # Per-client override map: KEY OMITTED on purpose. Spring Boot's
      # OriginTrackedYamlLoader loads BOTH an empty flow map `clients: {}` AND a
      # bare null `clients:` as the String "" (no String->Map converter -> context
      # fails to start on the first live pod, T16). With the key absent the field's
      # HashMap default stands. Add overrides by supplying real entries (tokens are
      # UPPERCASE, bracket them to survive relaxed binding):
      #   clients:
      #     "[FNBRF01]": PARTIAL
