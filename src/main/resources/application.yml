# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as MRV_BATCH_)
    database-change-log-table: mrv_databasechangelog
    database-change-log-lock-table: mrv_databasechangeloglock

dcre:
  batch:
    table-prefix: MRV_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../infra/dcre-infra/exchange}
  mrv:
    # R-41 acceptance semantics mirror CTV: whole-file rejection on any business FAIL
    # unless a client is explicitly mapped to PARTIAL. Binding is directly to the enum,
    # so an unknown mode value fails startup (fail closed).
    acceptance-mode:
      default: ALL_OR_NOTHING
      # Per-client override map: KEY OMITTED on purpose. Spring Boot's
      # OriginTrackedYamlLoader loads BOTH an empty flow map `clients: {}` AND a
      # bare null `clients:` as the String "" (no String->Map converter -> context
      # fails to start on the first live pod, T16). With the key absent the field's
      # HashMap default stands. Add overrides by supplying real entries (tokens are
      # UPPERCASE, bracket them to survive relaxed binding):
      #   clients:
      #     "[FNBRF01]": PARTIAL
